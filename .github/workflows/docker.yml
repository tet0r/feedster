name: Docker image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Unit tests
        id: tests
        run: |
          npm ci
          node --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=test-results.tap \
            test/*.test.js

      # Annotations are visible on the run page without opening the logs
      - name: Report test failures
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          grep -E -B2 -A25 '^ *not ok' test-results.tap | head -c 4000 > failures.txt || true
          node -e '
            const s = require("fs").readFileSync("failures.txt", "utf8").replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            console.log("::error title=Unit tests failed::" + (s || "see the Unit tests step log"));
          '

      # The VERSION file is the release number. A release is cut the first time
      # a given number reaches main; later pushes with the same number only refresh :latest.
      - name: Read version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION must look like 1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      # The toolbar extension ships with each release as feedster-extension.zip (one package
      # for Chrome, Edge and Firefox), stamped with the release version. Mozilla's linter
      # catches manifest mistakes before anyone installs it.
      - name: Browser extension
        run: |
          npx -y web-ext@10.7.0 lint --source-dir extension --self-hosted
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            m.version = process.argv[1];
            fs.writeFileSync("extension/manifest.json", JSON.stringify(m, null, 2) + "\n");
          ' "${{ steps.version.outputs.version }}"
          (cd extension && zip -qr ../feedster-extension.zip .)
          unzip -l feedster-extension.zip

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :latest and :main, a new VERSION -> :1.2.3 and :1.2, every build -> :sha-<commit>
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true' }}
            type=sha

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: feedster:test
          cache-from: type=gha

      # Starts the container the way the compose file does and checks it serves,
      # runs unprivileged, can write its database and reports the right version
      - name: Smoke test
        run: |
          docker volume create smoke-data
          docker run -d --name fs -p 8080:8080 -v smoke-data:/data -e FEEDSTER_REFRESH_MINUTES=0 feedster:test
          for i in $(seq 1 30); do curl -fs http://localhost:8080/api/state > /dev/null && break; sleep 1; done
          curl -fs http://localhost:8080/api/state | tee state.json
          grep -q "\"version\":\"${{ steps.version.outputs.version }}\"" state.json
          docker exec fs test -s /data/feedster.db
          uid=$(docker exec fs stat -c %u /proc/1)
          echo "app runs as uid $uid"; test "$uid" != "0"

      - name: Container logs
        if: failure()
        run: docker logs fs

      # Pull requests build only, to check the Dockerfile still works
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tags the commit and publishes this version's CHANGELOG section as the
      # release notes; running instances see the release and offer the update
      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {on=1; next} /^## \[/ {on=0} /^\[[^]]+\]: / {next} on' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notes.md feedster-extension.zip
          else
            gh release create "v$version" --target "$GITHUB_SHA" --generate-notes feedster-extension.zip
          fi

      # The browser extension goes to both stores with each new release. Each store's first
      # version is submitted by hand (store/SUBMITTING.md); until its secrets are set, the step skips.
      - name: Publish extension to Firefox Add-ons
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "::notice title=Firefox Add-ons::AMO_JWT_ISSUER / AMO_JWT_SECRET not set; skipping. See store/SUBMITTING.md."
            exit 0
          fi
          # Submits for Mozilla's review and returns without waiting for it.
          npx -y web-ext@10.7.0 sign --source-dir extension --channel listed --approval-timeout 0

      - name: Publish extension to Chrome Web Store
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.new == 'true'
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          if [ -z "$CWS_SERVICE_ACCOUNT" ] || [ -z "$CWS_PUBLISHER_ID" ] || [ -z "$CWS_EXTENSION_ID" ]; then
            echo "::notice title=Chrome Web Store::CWS_SERVICE_ACCOUNT / CWS_PUBLISHER_ID / CWS_EXTENSION_ID not set; skipping. See store/SUBMITTING.md."
            exit 0
          fi
          node scripts/publish-chrome.mjs feedster-extension.zip
